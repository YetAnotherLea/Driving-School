{% extends "polls/base.html" %}

{% block title %}Page introuvable{% endblock %}
{% block page_title %}Erreur 404{% endblock %}

{% block content %}
<div class="card" style="max-width:560px;text-align:center;padding:48px 32px;">
    <div style="font-size:56px;font-weight:800;color:var(--orange);line-height:1;">404</div>
    <h1 style="font-size:20px;font-weight:700;margin:16px 0 8px;">Cette page n'existe pas</h1>
    <p style="color:var(--muted);font-size:14px;margin-bottom:24px;">
        Le lien est peut-être erroné, ou la page a été supprimée.
    </p>
    <a href="{% url 'accueil' %}" class="btn btn-primary" style="justify-content:center;">
        Retour au tableau de bord
    </a>
</div>
{% endblock %}
